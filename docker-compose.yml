name: neurochess-arena

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neurochess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurochess_dev}
      POSTGRES_USER: ${POSTGRES_USER:-neurochess}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - neurochess_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  neurochess_postgres_data:
