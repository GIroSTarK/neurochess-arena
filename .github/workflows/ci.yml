name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  API_HOST: 127.0.0.1
  API_PORT: 3001
  DATABASE_URL: postgresql://neurochess:neurochess_ci@127.0.0.1:5432/neurochess_test
  TEST_DATABASE_URL: postgresql://neurochess:neurochess_ci@127.0.0.1:5432/neurochess_test
  LOG_LEVEL: info
  NODE_ENV: test
  VITE_API_BASE_URL: http://localhost:3001
  WEB_ORIGIN: http://localhost:5173

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: neurochess_test
          POSTGRES_PASSWORD: neurochess_ci
          POSTGRES_USER: neurochess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurochess -d neurochess_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Apply migrations twice
        run: npm run db:migrate && npm run db:migrate

      - name: Check migration metadata
        run: npm run db:check

      - name: Verify workspace
        run: npm run verify

      - name: Smoke-test built services
        run: npm run smoke

  browser:
    name: browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile-touch]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: neurochess_test
          POSTGRES_PASSWORD: neurochess_ci
          POSTGRES_USER: neurochess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurochess -d neurochess_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Test sandbox and AI acceptance
        run: npm run test:e2e -- --project=${{ matrix.project }}

  # Preserve the required check name while requiring every parallel job to succeed.
  verify:
    if: ${{ always() }}
    needs: [checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          if [[ "$CHECKS_RESULT" != "success" || "$BROWSER_RESULT" != "success" ]]; then
            echo "Required jobs did not all succeed: checks=$CHECKS_RESULT, browser=$BROWSER_RESULT"
            exit 1
          fi
