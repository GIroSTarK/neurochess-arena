name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: neurochess_test
          POSTGRES_PASSWORD: neurochess_ci
          POSTGRES_USER: neurochess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurochess -d neurochess_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      API_HOST: 127.0.0.1
      API_PORT: 3001
      DATABASE_URL: postgresql://neurochess:neurochess_ci@127.0.0.1:5432/neurochess_test
      TEST_DATABASE_URL: postgresql://neurochess:neurochess_ci@127.0.0.1:5432/neurochess_test
      LOG_LEVEL: info
      NODE_ENV: test
      VITE_API_BASE_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:5173
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: ci-only-auth-fixture-secret-not-for-deployment
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Apply migrations twice
        run: npm run db:migrate && npm run db:migrate

      - name: Check migration metadata
        run: npm run db:check

      - name: Verify workspace
        run: npm run verify

      - name: Smoke-test built services
        run: npm run smoke

  e2e:
    name: e2e-${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile-touch]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: neurochess_test
          POSTGRES_PASSWORD: neurochess_ci
          POSTGRES_USER: neurochess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurochess -d neurochess_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://neurochess:neurochess_ci@127.0.0.1:5432/neurochess_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Test browser project
        id: browser-tests
        run: npm run test:e2e -- --project=${{ matrix.project }} --output="$RUNNER_TEMP/neurochess-e2e-${{ matrix.project }}"

      - name: Upload browser durations
        if: ${{ !cancelled() && steps.browser-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-durations-${{ matrix.project }}
          path: ${{ runner.temp }}/neurochess-e2e-${{ matrix.project }}/durations.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser failure evidence
        if: ${{ failure() && steps.browser-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures-${{ matrix.project }}
          path: |
            ${{ runner.temp }}/neurochess-e2e-${{ matrix.project }}/**/test-failed-*.png
            ${{ runner.temp }}/neurochess-e2e-${{ matrix.project }}/durations.json
          if-no-files-found: warn
          retention-days: 7

  verify:
    if: ${{ always() }}
    needs: [checks, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require all CI jobs to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$E2E_RESULT" = success
