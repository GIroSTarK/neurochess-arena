name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: neurochess_test
          POSTGRES_PASSWORD: neurochess_ci
          POSTGRES_USER: neurochess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurochess -d neurochess_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      API_HOST: 127.0.0.1
      API_PORT: 3001
      DATABASE_URL: postgresql://neurochess:neurochess_ci@127.0.0.1:5432/neurochess_test
      TEST_DATABASE_URL: postgresql://neurochess:neurochess_ci@127.0.0.1:5432/neurochess_test
      LOG_LEVEL: info
      NODE_ENV: test
      VITE_API_BASE_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:5173
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: ci-only-auth-fixture-secret-not-for-deployment
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --omit=dev && npm audit

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Apply migrations twice
        run: npm run db:migrate && npm run db:migrate

      - name: Check migration metadata
        run: npm run db:check

      - name: Verify workspace
        run: npm run verify

      - name: Smoke-test built services
        run: npm run smoke

  e2e:
    uses: ./.github/workflows/browser-e2e.yml
    # Full Firefox/WebKit suites run in cross-browser.yml; deployment probes below cover each engine.
    with:
      matrix: |
        {
          "project": ["chromium-desktop", "chromium-mobile"],
          "shard": [1, 2],
          "include": [{ "browser": "chromium", "shards": 2 }]
        }

  performance:
    name: performance-${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile-touch]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: neurochess_test
          POSTGRES_PASSWORD: neurochess_ci
          POSTGRES_USER: neurochess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurochess -d neurochess_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://neurochess:neurochess_ci@127.0.0.1:5432/neurochess_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Check production performance budgets
        id: performance-tests
        run: npm run test:performance -- --project=${{ matrix.project }} --workers=1 --output="$RUNNER_TEMP/neurochess-performance-${{ matrix.project }}"

      - name: Upload performance measurements
        if: ${{ !cancelled() && steps.performance-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ matrix.project }}
          path: |
            ${{ runner.temp }}/neurochess-performance-${{ matrix.project }}/**/measurements.json
            ${{ runner.temp }}/neurochess-performance-${{ matrix.project }}/**/long-replay.json
            ${{ runner.temp }}/neurochess-performance-${{ matrix.project }}/**/wasm-memory.json
            ${{ runner.temp }}/neurochess-performance-${{ matrix.project }}/**/lifetimes.json
          if-no-files-found: warn
          retention-days: 7

  deployment:
    name: deployment-${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install acceptance browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build immutable deployment artifacts locally
        run: npm run build:deployment:test
      - name: Rehearse production deployment in isolation
        run: npm run test:deployment
      - name: Restore encrypted synthetic backups in isolation
        run: npm run test:recovery

  verify:
    if: ${{ always() }}
    needs: [checks, e2e, performance, deployment]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require all CI jobs to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$E2E_RESULT" = success
          test "$PERFORMANCE_RESULT" = success
          test "$DEPLOYMENT_RESULT" = success
