name: Browser E2E

on:
  workflow_call:
    inputs:
      matrix:
        description: Strategy matrix JSON; every combination needs project, shard, shards and browser.
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: e2e-${{ matrix.project }}-shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: neurochess_test
          POSTGRES_PASSWORD: neurochess_ci
          POSTGRES_USER: neurochess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurochess -d neurochess_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://neurochess:neurochess_ci@127.0.0.1:5432/neurochess_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Install browser engine and system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Test browser project
        id: browser-tests
        run: npm run test:e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --workers=1 --output="$RUNNER_TEMP/neurochess-e2e-${{ matrix.project }}-shard-${{ matrix.shard }}"

      - name: Upload browser durations
        if: ${{ !cancelled() && steps.browser-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-durations-${{ matrix.project }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/neurochess-e2e-${{ matrix.project }}-shard-${{ matrix.shard }}/durations.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser failure evidence
        if: ${{ failure() && steps.browser-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures-${{ matrix.project }}-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/neurochess-e2e-${{ matrix.project }}-shard-${{ matrix.shard }}/**/test-failed-*.png
            ${{ runner.temp }}/neurochess-e2e-${{ matrix.project }}-shard-${{ matrix.shard }}/durations.json
          if-no-files-found: warn
          retention-days: 7
