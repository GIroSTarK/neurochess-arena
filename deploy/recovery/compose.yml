name: neurochess-restore

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: neurochess-restore-postgres
    labels:
      io.neurochess.restore-isolated: "true"
    environment:
      POSTGRES_DB: neurochess
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-admin-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    entrypoint: [/bin/sh, /opt/neurochess/postgres-entrypoint.sh]
    volumes:
      - restored-data:/var/lib/postgresql
      - ../postgres-entrypoint.sh:/opt/neurochess/postgres-entrypoint.sh:ro
      - ../postgres-init.sh:/docker-entrypoint-initdb.d/10-neurochess.sh:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    secrets: [postgres-admin-password, postgres-app-password, postgres-cert, postgres-key]
    networks: [database]
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d neurochess"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: local
      options: { max-size: 10m, max-file: "3" }

secrets:
  postgres-admin-password:
    file: ${SECRETS_DIR:?Set an isolated external secrets directory}/postgres-admin-password
  postgres-app-password:
    file: ${SECRETS_DIR}/postgres-app-password
  postgres-cert:
    file: ${SECRETS_DIR}/postgres-cert.pem
  postgres-key:
    file: ${SECRETS_DIR}/postgres-key.pem

networks:
  database:
    internal: true

volumes:
  restored-data:
